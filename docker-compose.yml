services:
  postgres:
    image: postgres:16-alpine
    container_name: lazy-guy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lazyguy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lazyguy_secret}
      POSTGRES_DB: ${POSTGRES_DB:-lazy_guy_portfolio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lazyguy} -d ${POSTGRES_DB:-lazy_guy_portfolio}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
